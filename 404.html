<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страницата не е намерена | Bestjobs.BG</title>
    <style>
        :root { --primary: #1a73e8; --dark: #202124; --border: #dadce0; --text-muted: #5f6368; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f1f3f4; color: var(--dark); display: grid; grid-template-rows: auto 1fr auto; min-height: 100vh; }
        nav { background-color: white; border-bottom: 1px solid var(--border); padding: 15px 20px; display: grid; text-align: center; }
        nav .logo { font-size: 20px; font-weight: bold; color: var(--primary); text-decoration: none; }
        .error-container { display: grid; justify-items: center; text-align: center; padding: 40px 20px; max-width: 600px; margin: 0 auto; align-content: center; }
        .error-code { font-size: 96px; font-weight: bold; color: var(--primary); margin: 0; }
        h1 { font-size: 24px; margin: 20px 0 10px 0; }
        p { font-size: 16px; color: var(--text-muted); margin-bottom: 30px; }
        .btn-home { display: inline-block; background-color: var(--primary); color: white; padding: 12px 30px; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .countdown { font-size: 13px; color: var(--text-muted); margin-top: 20px; font-style: italic; }
        footer { background-color: white; border-top: 1px solid var(--border); padding: 20px; text-align: center; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
    <nav><a href="https://bestjobs.bg" class="logo">💼 Bestjobs.BG</a></nav>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 id="err-title">Страницата не е намерена</h1>
        <p id="err-desc">Линкът може да е остарял, обявата да е изтекла или страницата да е преместена.</p>
        <a href="https://bestjobs.bg" class="btn-home" id="err-btn">Към началната страница</a>
        <div class="countdown" id="countdown-text">Ще бъдете пренасочени автоматично след <span id="timer">8</span> секунди...</div>
    </div>
    <footer>&copy; <span id="year"></span> Bestjobs.BG. Всички права запазени.</footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        if (localStorage.getItem('site_lang') === 'en') {
            document.title = "404 - Page Not Found | Bestjobs.BG"; document.getElementById('err-title').textContent = "Page Not Found";
            document.getElementById('err-desc').textContent = "The link you followed may be broken or expired."; document.getElementById('err-btn').textContent = "Back to Home Page";
            document.getElementById('countdown-text').innerHTML = "You will be redirected automatically in <span id='timer'>8</span> seconds...";
        }
        let seconds = 8; const timerElement = document.getElementById('timer');
        const interval = setInterval(() => { seconds--; timerElement.textContent = seconds; if (seconds <= 0) { clearInterval(interval); window.location.href = "https://bestjobs.bg"; } }, 1000);
    </script>
</body>
</html>
